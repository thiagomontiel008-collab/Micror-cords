<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Desentierra los tesoros!</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="../Global/temporizador.css?v=5">
</head>
<body>
  <svg class="recursos-svg" aria-hidden="true">
    <symbol id="monticulo" viewBox="0 0 220 160">
      <path class="tierra" d="M12 142c5-28 18-34 34-40 7-25 27-35 47-34 12-29 48-39 72-18 17 1 32 15 34 35 13 9 16 26 19 57H12Z"/>
      <path d="M32 130c16-16 29-19 42-19m24-22c10-8 20-10 30-8m18 27c14-8 31-6 44 2M65 137l8-5m73-30 7-6m-93 17 5 3" fill="none" stroke="#432f22" stroke-linecap="round" stroke-width="5" opacity=".45"/>
      <path d="M39 101c-8-10-10-17-8-26m15 29c1-11 5-18 12-24m100-13c8-8 16-11 25-10m-29 14c1-9 5-16 11-21" fill="none" stroke="#8aa05b" stroke-linecap="round" stroke-width="6"/>
    </symbol>
  </svg>
  <main id="juego" class="juego">
    <div class="luna" aria-hidden="true"></div>
    <div class="colinas" aria-hidden="true"></div>
    <div class="suelo" aria-hidden="true"></div>
    <div id="rondas" class="rondas" aria-label="Tesoros encontrados: 0 de 3">
      <span class="ronda"></span>
      <span class="ronda"></span>
      <span class="ronda"></span>
    </div>
    <div id="excavaciones" class="excavaciones" aria-label="Cúmulos de tierra">
      <button type="button" class="sitio" aria-label="Excavar cúmulo de tierra">
        <svg class="monticulo" viewBox="0 0 220 160" aria-hidden="true"><use href="#monticulo"></use></svg>
        <svg class="hallazgo piedra" viewBox="0 0 120 100" aria-hidden="true">
          <path d="m18 76 8-32 21-20 28 6 22 23-8 29-35 10-28-4Z"/>
          <path d="m42 45 14-13m14 14 12 16M38 69l19-5" fill="none" stroke="#b8b5a8" stroke-linecap="round" stroke-width="5" opacity=".65"/>
        </svg>
        <svg class="hallazgo tesoro" viewBox="0 0 120 100" aria-hidden="true">
          <path class="cofre-tapa" d="M22 40c0-15 17-25 38-25s38 10 38 25v10H22Z"/>
          <path class="cofre-cuerpo" d="M20 50h80l-8 39H28Z"/>
          <path class="cofre-metal" d="M22 45h76v10H22zm32 0h12v44H54z"/>
          <path class="cofre-cerradura" d="M53 62h14v16H53zm3-7h8v8h-8z"/>
          <circle class="moneda" cx="30" cy="27" r="9"/>
          <circle class="moneda" cx="88" cy="25" r="8"/>
        </svg>
      </button>
      <button type="button" class="sitio" aria-label="Excavar cúmulo de tierra">
        <svg class="monticulo" viewBox="0 0 220 160" aria-hidden="true"><use href="#monticulo"></use></svg>
        <svg class="hallazgo piedra" viewBox="0 0 120 100" aria-hidden="true">
          <path d="m18 76 8-32 21-20 28 6 22 23-8 29-35 10-28-4Z"/>
          <path d="m42 45 14-13m14 14 12 16M38 69l19-5" fill="none" stroke="#b8b5a8" stroke-linecap="round" stroke-width="5" opacity=".65"/>
        </svg>
        <svg class="hallazgo tesoro" viewBox="0 0 120 100" aria-hidden="true">
          <path class="cofre-tapa" d="M22 40c0-15 17-25 38-25s38 10 38 25v10H22Z"/>
          <path class="cofre-cuerpo" d="M20 50h80l-8 39H28Z"/>
          <path class="cofre-metal" d="M22 45h76v10H22zm32 0h12v44H54z"/>
          <path class="cofre-cerradura" d="M53 62h14v16H53zm3-7h8v8h-8z"/>
          <circle class="moneda" cx="30" cy="27" r="9"/>
          <circle class="moneda" cx="88" cy="25" r="8"/>
        </svg>
      </button>
    </div>
    <svg id="pala-rota" class="pala-rota" viewBox="0 0 100 150" role="img" aria-label="Pala rota">
      <path d="m48 14 8 4-24 75-8-3Z" fill="#9b6840" stroke="#503b2b" stroke-width="4"/>
      <path d="m31 85 25 8-14 27c-4 8-13 9-19 5l-8-6c-6-5-7-13-2-19Z" fill="#929497" stroke="#46484b" stroke-width="4"/>
      <path d="m21 119 11-7m0 12 10-7" stroke="#36383a" stroke-linecap="round" stroke-width="5"/>
      <path d="m53 15 9-4" stroke="#503b2b" stroke-linecap="round" stroke-width="6"/>
    </svg>
  </main>
  <div class="Contienevideo">
    <video id="mostrarmicrojuego" src="../../../Recursos/Microjuegos/Global/streve%20corriendo.mp4" autoplay muted playsinline></video>
    <div id="Texto">¡Desentierra los tesoros!</div>
  </div>
  <video id="Perder" src="../../../Recursos/Microjuegos/Global/streve%20tropezando.mp4" muted playsinline></video>
  <img id="Ganar" src="../../../Recursos/Microjuegos/Global/confetti-25%20(1).jpg" alt="¡Ganaste!">
  <div id="temporizador-mecha" class="temporizador-mecha" role="img" aria-label="Reloj del tiempo de juego">
    <div class="mecha">
      <span class="tramo-mecha tramo-1"></span>
      <span class="tramo-mecha tramo-2"></span>
      <span class="tramo-mecha tramo-3"></span>
    </div>
    <div class="reloj">
      <span class="manecilla manecilla-minuto"></span>
      <span class="manecilla manecilla-segundo"></span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
